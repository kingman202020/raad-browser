name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # لا يوجد gradle-wrapper في المستودع، لذلك نثبت Gradle مباشرة
      - name: Install Gradle
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: raad-browser-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # إنشاء/تحديث Release باسم latest مع إرفاق ملف APK للتحميل المباشر
      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Raad Browser APK (latest)
          files: app/build/outputs/apk/debug/app-debug.apk
          prerelease: false
